server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same origin for UI and API, so the API needs no CORS. No URI in proxy_pass: the request URI
    # (including /api/ and the query string) is forwarded unchanged. Headers such as If-Match,
    # ETag and X-User-Name pass through. Compression is off here because nginx weakens ETags
    # of the responses it compresses.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;
    }

    # The shell must never be cached, so a new build is picked up (assets are content-hashed).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # History fallback: deep links such as /requests?status=Open survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
